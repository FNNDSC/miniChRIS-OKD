[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-smoke"
version = "0.1.0"
description = "Functional end-to-end smoke test for a ChRIS deployment (HARBOR issue #131)"
requires-python = ">=3.10"
dependencies = [
    # The team-owned CUBE API client is the transport layer; chris_smoke/client.py
    # is the only module that imports it. Pin recorded in docs/versions.md.
    "python-chrisclient==2.15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chris-smoke = "chris_smoke.cli:main"

[tool.setuptools]
packages = ["chris_smoke"]
